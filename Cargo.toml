[package]
name = "redact"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "A CLIProxyAPI plugin that keeps secrets out of the requests your coding agents send."
repository = "https://github.com/ryuudotgg/redact"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1.5"
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
